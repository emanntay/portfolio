<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily Taylor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="about-fixed"><button id="aboutBtn" class="about-btn">About</button></div>

  <nav id="nav" class="nav">
    <div class="corner corner-tl"><span id="siteName" class="site-name">Emily Taylor</span></div>

    <div id="navList" class="nav-list"></div>

    <div class="corner corner-bl">
      <div id="widget" class="widget">
        <svg class="widget-clock" id="clockFace" viewBox="0 0 40 40">
          <circle class="face" cx="20" cy="20" r="18.5"></circle>
          <line class="tick" x1="20" y1="3" x2="20" y2="5.5"></line>
          <line class="tick" x1="20" y1="34.5" x2="20" y2="37"></line>
          <line class="tick" x1="3" y1="20" x2="5.5" y2="20"></line>
          <line class="tick" x1="34.5" y1="20" x2="37" y2="20"></line>
          <line id="handHr" class="hand-hr" x1="20" y1="20" x2="20" y2="12"></line>
          <line id="handMin" class="hand-min" x1="20" y1="20" x2="20" y2="7"></line>
          <circle class="pin" cx="20" cy="20" r="1.6"></circle>
        </svg>
        <div id="widgetText" class="widget-text"></div>
      </div>
    </div>
  </nav>

  <main id="rail" class="rail">
    <div id="landing" class="landing" role="button" tabindex="0" aria-label="Enter site">
      <div class="swirl" aria-hidden="true">
        <div class="blob blob-brown"></div>
        <div class="blob blob-red"></div>
        <div class="blob blob-purple"></div>
        <div class="blob blob-lime"></div>
        <div class="blob blob-orange"></div>
      </div>
    </div>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="aboutModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <button class="modal-close" data-close aria-label="Close">&times;</button>
    <div id="aboutBody" class="about-body"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" data-lightbox-close aria-label="Close">&times;</button>
  <button class="lightbox-arrow lightbox-prev" data-lightbox-prev aria-label="Previous">&#8249;</button>
  <div id="lightboxContent" class="lightbox-content"></div>
  <button class="lightbox-arrow lightbox-next" data-lightbox-next aria-label="Next">&#8250;</button>
</div>

<script src="js/content.js"></script>
<script src="js/manifest.js"></script>
<script src="js/app.js"></script>
</body>
</html>
