<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily Taylor</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="pre-reveal">
<div id="app">
  <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="about-fixed"><button id="aboutBtn" class="about-btn">About</button></div>

  <nav id="nav" class="nav">
    <div class="corner corner-tl"><span id="siteName" class="site-name" tabindex="0" role="button" aria-label="Scroll to top">Emily Taylor</span></div>

    <div id="navList" class="nav-list"></div>

    <div class="corner corner-bl">
      <div id="widget" class="widget">
        <svg class="widget-clock" id="clockFace" viewBox="0 0 40 40">
          <circle class="face" cx="20" cy="20" r="18.5"></circle>
          <line class="tick" x1="20" y1="3" x2="20" y2="5.5"></line>
          <line class="tick" x1="20" y1="34.5" x2="20" y2="37"></line>
          <line class="tick" x1="3" y1="20" x2="5.5" y2="20"></line>
          <line class="tick" x1="34.5" y1="20" x2="37" y2="20"></line>
          <line id="handHr" class="hand-hr" x1="20" y1="20" x2="20" y2="12"></line>
          <line id="handMin" class="hand-min" x1="20" y1="20" x2="20" y2="7"></line>
          <circle class="pin" cx="20" cy="20" r="1.6"></circle>
        </svg>
        <div class="widget-text">
          <div id="widgetDate" class="widget-date"></div>
          <div id="widgetWeather" class="widget-weather"></div>
        </div>
      </div>
    </div>
  </nav>

  <main id="rail" class="rail">
    <div id="landing" class="landing" role="button" tabindex="0" aria-label="Enter site">
      <div id="landingThumbs" class="landing-thumbs" aria-hidden="true"></div>
    </div>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="aboutPanel" class="about-panel" aria-hidden="true">
  <div class="about-panel-inner">
    <div id="aboutBody" class="about-copy"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" data-lightbox-close aria-label="Close"><svg viewBox="0 0 7 7" shape-rendering="crispEdges"><rect x="0" y="0" width="1" height="1" fill="currentColor"/><rect x="6" y="0" width="1" height="1" fill="currentColor"/><rect x="1" y="1" width="1" height="1" fill="currentColor"/><rect x="5" y="1" width="1" height="1" fill="currentColor"/><rect x="2" y="2" width="1" height="1" fill="currentColor"/><rect x="4" y="2" width="1" height="1" fill="currentColor"/><rect x="3" y="3" width="1" height="1" fill="currentColor"/><rect x="2" y="4" width="1" height="1" fill="currentColor"/><rect x="4" y="4" width="1" height="1" fill="currentColor"/><rect x="1" y="5" width="1" height="1" fill="currentColor"/><rect x="5" y="5" width="1" height="1" fill="currentColor"/><rect x="0" y="6" width="1" height="1" fill="currentColor"/><rect x="6" y="6" width="1" height="1" fill="currentColor"/></svg></button>
  <button class="lightbox-arrow lightbox-prev" data-lightbox-prev aria-label="Previous"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><rect x="3" y="1" width="1" height="1" fill="currentColor"/><rect x="3" y="2" width="2" height="1" fill="currentColor"/><rect x="3" y="3" width="3" height="1" fill="currentColor"/><rect x="3" y="4" width="4" height="1" fill="currentColor"/><rect x="3" y="5" width="3" height="1" fill="currentColor"/><rect x="3" y="6" width="2" height="1" fill="currentColor"/><rect x="3" y="7" width="1" height="1" fill="currentColor"/></svg></button>
  <div id="lightboxContent" class="lightbox-content"></div>
  <button class="lightbox-arrow lightbox-next" data-lightbox-next aria-label="Next"><svg viewBox="0 0 10 10" shape-rendering="crispEdges"><rect x="3" y="1" width="1" height="1" fill="currentColor"/><rect x="3" y="2" width="2" height="1" fill="currentColor"/><rect x="3" y="3" width="3" height="1" fill="currentColor"/><rect x="3" y="4" width="4" height="1" fill="currentColor"/><rect x="3" y="5" width="3" height="1" fill="currentColor"/><rect x="3" y="6" width="2" height="1" fill="currentColor"/><rect x="3" y="7" width="1" height="1" fill="currentColor"/></svg></button>
</div>

<script src="js/content.js"></script>
<script src="js/manifest.js"></script>
<script src="js/app.js"></script>
</body>
</html>
