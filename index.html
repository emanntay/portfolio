<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily Taylor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav id="nav" class="nav">
    <div class="corner corner-tl"><span id="siteName" class="site-name">Emily Taylor</span></div>
    <div class="corner corner-tr"><button id="aboutBtn" class="about-btn">About</button></div>

    <div id="navList" class="nav-list"></div>

    <div class="corner corner-bl"><div id="widget" class="widget"></div></div>
    <div class="corner corner-br"></div>
  </nav>

  <main id="rail" class="rail">
    <div id="landing" class="landing">
      <div class="swirl" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
      </div>
      <p class="landing-hint">select a section to begin</p>
    </div>
    <div id="content" class="content"></div>
  </main>
</div>

<div id="aboutModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel">
    <button class="modal-close" data-close aria-label="Close">&times;</button>
    <div id="aboutBody" class="about-body"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" aria-hidden="true">
  <button class="lightbox-close" data-lightbox-close aria-label="Close">&times;</button>
  <button class="lightbox-arrow lightbox-prev" data-lightbox-prev aria-label="Previous">&#8249;</button>
  <div id="lightboxContent" class="lightbox-content"></div>
  <button class="lightbox-arrow lightbox-next" data-lightbox-next aria-label="Next">&#8250;</button>
</div>

<script src="js/content.js"></script>
<script src="js/manifest.js"></script>
<script src="js/app.js"></script>
</body>
</html>
